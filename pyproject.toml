[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockout"
version = "0.1.0"
description = "Blockout desde una cámara móvil - Visión por Computador, UTP 2026-II"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
